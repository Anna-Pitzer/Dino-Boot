<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #304269 0%, #1a2540 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Press Start 2P', cursive;
  color: #ffffff;
  padding: 20px;
}

.arcade-container {
  max-width: 600px;
  width: 100%;
  background: linear-gradient(to bottom, #304269, #1a1f2e);
  border: 8px solid #304269;
  border-radius: 20px;
  padding: 40px 30px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  text-align: center;
}

.screen {
  background: linear-gradient(135deg, #D9E8F5 0%, #91BED4 100%);
  border: 4px solid #304269;
  border-radius: 10px;
  padding: 30px;
  margin-bottom: 30px;
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
  min-height: 180px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.title {
  font-size: 32px;
  color: #F26101;
  text-shadow: 4px 4px 0px #304269, 8px 8px 0px rgba(0, 0, 0, 0.5);
  margin-bottom: 15px;
  animation: flicker 0.15s infinite, glow 2s ease-in-out infinite;
  letter-spacing: 3px;
}

.subtitle {
  font-size: 12px;
  color: #304269;
  margin-bottom: 10px;
  letter-spacing: 2px;
  animation: blink 1.5s infinite;
}

.score-board {
  display: flex;
  justify-content: space-around;
  width: 100%;
  margin-bottom: 20px;
  padding: 10px;
  background: rgba(0, 0, 0, 0.2);
  border-radius: 5px;
}

.score-item {
  font-size: 10px;
  color: #304269;
  font-weight: bold;
}

.score-value {
  font-size: 14px;
  color: #F26101;
  margin-top: 5px;
}

.button-group {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-bottom: 20px;
}

.arcade-button {
  padding: 15px 20px;
  font-family: 'Press Start 2P', cursive;
  font-size: 12px;
  letter-spacing: 2px;
  border: 3px solid #F26101;
  background: linear-gradient(to bottom, #91BED4, #304269);
  color: #ffffff;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.1s;
  text-transform: uppercase;
  box-shadow: 0 6px 0 #1a2540, 0 6px 20px rgba(242, 97, 1, 0.4);
  transform: translateY(0);
}

.arcade-button:hover {
  background: linear-gradient(to bottom, #D9E8F5, #91BED4);
  color: #304269;
  box-shadow: 0 2px 0 #1a2540, 0 4px 15px rgba(242, 97, 1, 0.6);
  transform: translateY(4px);
}

.arcade-button:active {
  transform: translateY(6px);
  box-shadow: 0 0 0 #1a2540, 0 2px 10px rgba(242, 97, 1, 0.3);
}

.arcade-button.primary {
  background: linear-gradient(to bottom, #F26101, #d64700);
  border-color: #ffffff;
  animation: pulse 2s infinite;
}

.arcade-button.primary:hover {
  background: linear-gradient(to bottom, #ff7f1a, #e85a00);
  color: #ffffff;
}

.led-lights {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 20px;
}

.led {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid #304269;
  animation: ledBlink 0.5s infinite;
}

.led.red {
  background: #ff0000;
  box-shadow: 0 0 10px #ff0000;
  animation-delay: 0s;
}

.led.orange {
  background: #F26101;
  box-shadow: 0 0 10px #F26101;
  animation-delay: 0.2s;
}

.led.blue {
  background: #91BED4;
  box-shadow: 0 0 10px #91BED4;
  animation-delay: 0.4s;
}

.arcade-panel {
  background: rgba(255, 255, 255, 0.1);
  border: 2px dashed #91BED4;
  border-radius: 8px;
  padding: 15px;
  font-size: 10px;
  color: #D9E8F5;
  margin-top: 15px;
  line-height: 1.6;
}

@keyframes flicker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.8; }
}

@keyframes glow {
  0%, 100% { text-shadow: 4px 4px 0px #304269, 8px 8px 0px rgba(0, 0, 0, 0.5), 0 0 20px #F26101; }
  50% { text-shadow: 4px 4px 0px #304269, 8px 8px 0px rgba(0, 0, 0, 0.5), 0 0 40px #F26101; }
}

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes ledBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

@media (max-width: 600px) {
  .arcade-container {
    padding: 20px;
  }
  
  .title {
    font-size: 24px;
  }
  
  .arcade-button {
    font-size: 10px;
    padding: 12px 15px;
  }
}
</style>

<div class="arcade-container">
  <div class="screen">
    <h1 class="title">RETRO ARCADE</h1>
    <p class="subtitle">» START YOUR ADVENTURE «</p>
    
    <div class="score-board">
      <div class="score-item">
        LEVEL<br/>
        <span class="score-value">01</span>
      </div>
      <div class="score-item">
        SCORE<br/>
        <span class="score-value">12450</span>
      </div>
      <div class="score-item">
        LIVES<br/>
        <span class="score-value">3</span>
      </div>
    </div>
  </div>

  <div class="led-lights">
    <div class="led red"></div>
    <div class="led orange"></div>
    <div class="led blue"></div>
  </div>

  <div class="button-group">
    <button class="arcade-button primary" onclick="this.style.background = 'linear-gradient(to top, #F26101, #d64700)'; setTimeout(() => this.style.background = 'linear-gradient(to bottom, #F26101, #d64700)', 100);">
      ▶ PLAY GAME
    </button>
    <button class="arcade-button" onclick="alert('⚙ OPTIONS MENU\\n\\n- Difficulty\\n- Sound\\n- Controls')">
      ☰ OPTIONS
    </button>
    <button class="arcade-button" onclick="alert('📊 HIGH SCORES\\n\\n1. PLAYER - 98500\\n2. RETRO - 87200\\n3. ARCADIAN - 76350')">
      ★ HIGH SCORES
    </button>
    <button class="arcade-button" onclick="alert('❓ GAME INFO\\n\\nRelease: 2024\\nDeveloper: RetroLab\\nMode: Arcade Classic')">
      ⓘ ABOUT
    </button>
  </div>

  <div class="arcade-panel">
    INSERT COIN TO CONTINUE...<br/>
    ★ ★ ★ PRESS START ★ ★ ★
  </div>
</div>
